name: Account deletion live integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  account-deletion-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMARTLOO_TEST_POSTGIS: '1'
      SMARTLOO_TEST_MONGO: '1'
      SMARTLOO_DB_HOST: 127.0.0.1
      SMARTLOO_MONGO_URL: mongodb://127.0.0.1:27017
      SMARTLOO_MAP_JUNIT: ${{ github.workspace }}/account-deletion-live.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci
        working-directory: frontend
      - run: docker compose up -d --wait postgis mongo
      - run: docker compose exec -T postgis sh /db/scripts/migrate.sh
      - name: Mounted account deletion with actual cleanup, errors and session expiry
        run: python scripts/check_map_reviews_live.py --suite deletion
      - name: Reject missing, failed or skipped evidence
        if: always()
        run: python scripts/check_required_junit.py account-deletion-live.xml --minimum 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-deletion-live
          path: account-deletion-live.xml
          if-no-files-found: error
      - name: Stop test services
        if: always()
        run: docker compose down -v
