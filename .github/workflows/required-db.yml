name: Required database suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMARTLOO_TEST_POSTGIS: '1'
      SMARTLOO_TEST_MONGO: '1'
      SMARTLOO_MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select required suite
        id: suite
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            mongo) echo 'service=mongo' >> "$GITHUB_OUTPUT" ;;
            auth|detail|admin_import) echo 'service=postgis' >> "$GITHUB_OUTPUT" ;;
            reviews|analytics|deletion) echo 'service=postgis mongo' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unknown suite: $SUITE" >&2; exit 1 ;;
          esac
      - run: python -m pip install -r requirements-test.txt
      - name: Start real database
        env:
          SERVICE: ${{ steps.suite.outputs.service }}
        run: |
          read -ra services <<< "$SERVICE"
          docker compose up -d --wait "${services[@]}"
      - name: Apply PostgreSQL migrations and seed
        if: inputs.suite != 'mongo'
        run: |
          docker compose exec -T postgis sh /db/scripts/migrate.sh
          docker compose exec -T postgis psql -v ON_ERROR_STOP=1 -f /db/seeds/fixtures.sql
      - name: Run required real database tests
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            mongo) python -m pytest tests/test_review_scores_mongo.py -q --junitxml=required-results.xml ;;
            auth) python -m pytest tests/test_auth_postgres.py tests/test_auth_password_bytes.py -q --junitxml=required-results.xml ;;
            detail) python -m pytest tests/test_toilet_detail.py -q --junitxml=required-results.xml ;;
            reviews) python -m pytest tests/test_reviews.py tests/test_review_consistency.py tests/test_review_publication.py tests/test_reviews_integration.py -q --junitxml=required-results.xml ;;
            analytics) python -m pytest tests/test_admin_analytics.py tests/test_admin_analytics_integration.py tests/test_requirements.py -q -k 'admin_analytics or tc_09 or tc_10 or tc_24 or tc_25 or tc_45' --junitxml=required-results.xml ;;
            deletion) python -m pytest tests/test_account_deletion.py tests/test_account_deletion_integration.py tests/test_requirements.py -q -k 'account_deletion or tc_34' --junitxml=required-results.xml ;;
            admin_import) python -m pytest tests/test_admin_import.py tests/test_admin_import_postgres.py tests/test_requirements.py -q -k 'admin_import or tc_19 or tc_20 or tc_36' --junitxml=required-results.xml ;;
          esac
      - name: Reject skipped or incomplete suite
        if: always()
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          case "$SUITE" in
            mongo|detail) minimum=6 ;;
            auth) minimum=18 ;;
            reviews) minimum=35 ;;
            analytics) minimum=39 ;;
            deletion) minimum=15 ;;
            admin_import) minimum=39 ;;
            *) exit 1 ;;
          esac
          python scripts/check_required_junit.py required-results.xml --minimum "$minimum"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-${{ inputs.suite }}
          path: required-results.xml
          if-no-files-found: error
      - name: Stop database
        if: always()
        run: docker compose down -v
