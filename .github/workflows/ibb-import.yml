name: IBB source import checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ibb-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMARTLOO_TEST_POSTGIS: '1'
      SMARTLOO_DB_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-test.txt
      - run: docker compose up -d --wait postgis
      - run: docker compose exec -T postgis sh /db/scripts/migrate.sh
      - run: python -m pytest tests/test_ibb_geojson.py tests/test_ibb_import.py tests/test_ibb_import_postgres.py -q --junitxml=ibb-results.xml
      - name: Require complete non-skipped evidence
        if: always()
        run: python scripts/check_required_junit.py ibb-results.xml --minimum 37
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibb-import-evidence
          path: ibb-results.xml
          if-no-files-found: error
      - if: always()
        run: docker compose down -v
