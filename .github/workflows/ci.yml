name: SmartLoo review checks
on:
  push:
    branches: [main, weekly-review-2026-10-24]
  pull_request:
    branches: [main]
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test && npm run build
        working-directory: frontend
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --wait
      - run: docker compose exec -T postgis sh /db/scripts/migrate.sh
      - run: docker compose exec -T postgis sh /db/scripts/check.sh
      - if: always()
        run: docker compose down -v
  requirements-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-test.txt
      - name: Unimplemented acceptance baseline (visible failure, not a passing gate)
        continue-on-error: true
        run: python -m pytest -v --junitxml=requirements-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-baseline
          path: requirements-results.xml
