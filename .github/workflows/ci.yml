name: SmartLoo review checks
on:
  push:
    branches: [main, weekly-review-2026-10-24]
  pull_request:
    branches: [main, weekly-review-2026-10-24]
jobs:
  integration-suites:
    runs-on: ubuntu-latest
    outputs:
      mongo: ${{ steps.detect.outputs.mongo }}
      auth: ${{ steps.detect.outputs.auth }}
      detail: ${{ steps.detect.outputs.detail }}
      reviews: ${{ steps.detect.outputs.reviews }}
      analytics: ${{ steps.detect.outputs.analytics }}
      deletion: ${{ steps.detect.outputs.deletion }}
      admin_import: ${{ steps.detect.outputs.admin_import }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect implemented database suites
        id: detect
        env:
          PREVIOUS: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          present_or_removed() {
            test -f "$1" || git cat-file -e "$PREVIOUS:$1" 2>/dev/null
          }
          for suite in mongo auth detail reviews analytics deletion admin_import; do
            required=false
            case "$suite" in
              mongo) if present_or_removed tests/test_review_scores_mongo.py; then required=true; fi ;;
              auth) if present_or_removed tests/test_auth_postgres.py || present_or_removed tests/test_auth_password_bytes.py; then required=true; fi ;;
              detail) if present_or_removed tests/test_toilet_detail.py; then required=true; fi ;;
              reviews) if present_or_removed tests/test_reviews.py || present_or_removed tests/test_reviews_integration.py || present_or_removed tests/test_review_consistency.py; then required=true; fi ;;
              analytics) if present_or_removed tests/test_admin_analytics.py || present_or_removed tests/test_admin_analytics_integration.py; then required=true; fi ;;
              deletion) if present_or_removed tests/test_account_deletion.py || present_or_removed tests/test_account_deletion_integration.py; then required=true; fi ;;
              admin_import) if present_or_removed tests/test_admin_import.py || present_or_removed tests/test_admin_import_postgres.py; then required=true; fi ;;
            esac
            echo "$suite=$required" >> "$GITHUB_OUTPUT"
          done
  mongo-integration:
    needs: integration-suites
    if: needs.integration-suites.outputs.mongo == 'true'
    uses: ./.github/workflows/required-db.yml
    with:
      suite: mongo
  auth-integration:
    needs: integration-suites
    if: needs.integration-suites.outputs.auth == 'true'
    uses: ./.github/workflows/required-db.yml
    with:
      suite: auth
  detail-integration:
    needs: integration-suites
    if: needs.integration-suites.outputs.detail == 'true'
    uses: ./.github/workflows/required-db.yml
    with:
      suite: detail
  reviews-integration:
    needs: integration-suites
    if: needs.integration-suites.outputs.reviews == 'true'
    uses: ./.github/workflows/required-db.yml
    with:
      suite: reviews
  analytics-integration:
    needs: integration-suites
    if: needs.integration-suites.outputs.analytics == 'true'
    uses: ./.github/workflows/required-db.yml
    with:
      suite: analytics
  deletion-integration:
    needs: integration-suites
    if: needs.integration-suites.outputs.deletion == 'true'
    uses: ./.github/workflows/required-db.yml
    with:
      suite: deletion
  admin-import-integration:
    needs: integration-suites
    if: needs.integration-suites.outputs.admin_import == 'true'
    uses: ./.github/workflows/required-db.yml
    with:
      suite: admin_import
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --coverage && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostGIS, MongoDB and Redis health checks
        run: docker compose up -d --wait
      - run: docker compose exec -T postgis sh /db/scripts/migrate.sh
      - run: docker compose exec -T postgis sh /db/scripts/check.sh
      - if: always()
        run: docker compose down -v
  requirements-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the actual frontend for the TC-21 cloud shell contract
        run: npm ci && npm run build
        working-directory: frontend
      - name: Require the isolated acceptance catalog and cloud shell tests
        run: python -m pytest tests/test_requirements.py tests/test_cloud_app.py -q --junitxml=catalog-required.xml
      - name: Reject missing, failed or skipped catalog evidence
        if: always()
        run: python scripts/check_required_junit.py catalog-required.xml --minimum 66
      - name: Unimplemented acceptance baseline (visible failure, not a passing gate)
        continue-on-error: true
        run: python -m pytest -v --junitxml=requirements-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requirements-baseline
          path: |
            requirements-results.xml
            catalog-required.xml
  search:
    name: Nearby search tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run isolated search tests
        run: >-
          python -m pytest tests/test_requirements.py
          -k "tc_01 or tc_02 or tc_03 or tc_11 or tc_12 or tc_13 or tc_14"
          -q

      - name: Run nearby input and failure safety checks
        run: python -m pytest tests/test_nearby_safety.py -q

      - name: Start PostGIS
        run: docker compose up -d --wait postgis

      - name: Apply migrations
        run: docker compose exec -T postgis sh /db/scripts/migrate.sh

      - name: Load synthetic fixtures
        run: >-
          docker compose exec -T postgis
          psql -v ON_ERROR_STOP=1 -f /db/seeds/fixtures.sql

      - name: Run PostGIS integration tests
        env:
          SMARTLOO_TEST_POSTGIS: "1"
        run: python -m pytest tests/test_nearby_postgis.py tests/test_nearby_pool.py tests/test_nearby_response.py -q --junitxml=nearby-results.xml

      - name: Require all nearby and pool checks
        run: python scripts/check_required_junit.py nearby-results.xml --minimum 13

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nearby-pool-results
          path: nearby-results.xml
          if-no-files-found: error

      - name: Stop PostGIS
        if: always()
        run: docker compose down -v
