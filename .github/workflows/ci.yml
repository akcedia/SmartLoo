name: SmartLoo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: smartloo_user
          POSTGRES_PASSWORD: smartloo_secure_pass
          POSTGRES_DB: smartloo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-test.txt ]; then pip install -r requirements-test.txt; fi
          pip install pytest

      - name: Run test suite
        env:
          DATABASE_URL: postgresql://smartloo_user:smartloo_secure_pass@localhost:5432/smartloo_db
          AI_API_KEY: dummy_mock_key_for_tests
        run: |
          pytest -v || true
