name: Admin panel live integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  admin-panel-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SMARTLOO_TEST_POSTGIS: '1'
      SMARTLOO_TEST_MONGO: '1'
      SMARTLOO_DB_HOST: 127.0.0.1
      SMARTLOO_MONGO_URL: mongodb://127.0.0.1:27017
      SMARTLOO_MAP_JUNIT: ${{ github.workspace }}/admin-panel-live.xml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements-test.txt
      - run: npm ci
        working-directory: frontend
      - run: docker compose up -d --wait postgis mongo
      - run: docker compose exec -T postgis sh /db/scripts/migrate.sh
      - name: Mounted ADMIN panel and actual CSV/JSON responses
        run: python scripts/check_map_reviews_live.py --suite analytics
      - name: Reject missing, failed or skipped evidence
        if: always()
        run: python scripts/check_required_junit.py admin-panel-live.xml --minimum 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admin-panel-live
          path: admin-panel-live.xml
          if-no-files-found: error
      - name: Stop test services
        if: always()
        run: docker compose down -v
