name: Free cloud image checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cloud-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify cloud routes, nearby safety and password boundaries
        run: python -m pytest tests/test_cloud_app.py tests/test_nearby_safety.py tests/test_auth_password_bytes.py -q
      - name: Build tested frontend and nonroot cloud image
        run: docker build --build-arg VCS_REF="$GITHUB_SHA" -t smartloo-cloud:check -f docker/Dockerfile.cloud .
      - name: Check actual image command without external network or credentials
        run: python scripts/check_cloud_image.py --image smartloo-cloud:check
