<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>SmartLoo</title>
    <script>
      // Resolve the theme before first paint (same rules as src/shared/theme/theme.js).
      (function () {
        var pref = "system";
        try { pref = localStorage.getItem("smartloo.theme") || "system"; } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#030405" : "#ffffff");
        try { if (localStorage.getItem("smartloo.reduceMotion") === "on") document.documentElement.setAttribute("data-motion", "reduce"); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
