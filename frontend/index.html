<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png?v=logo-20261124" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=logo-20261124" />
    <link rel="manifest" href="/manifest.webmanifest?v=logo-20261124" />
    <meta name="apple-mobile-web-app-title" content="SmartLoo" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>SmartLoo</title>
    <script>
      // Resolve the theme before first paint (same rules as src/shared/theme/theme.js).
      (function () {
        var pref = "light";
        try {
          var saved = localStorage.getItem("smartloo.theme");
          if (["system", "light", "dark"].indexOf(saved) !== -1) pref = saved;
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]').setAttribute("content", dark ? "#030405" : "#ffffff");
        try { if (localStorage.getItem("smartloo.reduceMotion") === "on") document.documentElement.setAttribute("data-motion", "reduce"); } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
