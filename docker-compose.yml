# Shared local development services.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${SMARTLOO_DB_USER:-smartloo}
      POSTGRES_PASSWORD: ${SMARTLOO_DB_PASSWORD:-smartloo-dev-only}
      POSTGRES_DB: ${SMARTLOO_DB_NAME:-smartloo}
      PGUSER: ${SMARTLOO_DB_USER:-smartloo}
      PGDATABASE: ${SMARTLOO_DB_NAME:-smartloo}
      TZ: Europe/Istanbul
    ports:
      - "127.0.0.1:${SMARTLOO_DB_PORT:-5432}:5432"
    volumes:
      - ./db:/db:ro
      - smartloo-pgdata:/var/lib/postgresql/data
    healthcheck:
      # Check TCP: the initialization-only server accepts Unix sockets too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -q"]
      interval: 2s
      timeout: 3s
      retries: 30

  mongo:
    image: mongo:7.0
    ports:
      - "127.0.0.1:${SMARTLOO_MONGO_PORT:-27017}:27017"
    volumes:
      - smartloo-mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:${SMARTLOO_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  smartloo-pgdata:
  smartloo-mongodata:
