version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: smartloo-postgis
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartloo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartloo_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-smartloo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data:
